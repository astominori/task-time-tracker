<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.3" y2="0.3">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#shine)"/>

  <!-- Stopwatch body -->
  <circle cx="230" cy="285" r="130" fill="none" stroke="white" stroke-width="18" opacity="0.95"/>

  <!-- Stopwatch top button -->
  <rect x="215" y="125" width="30" height="36" rx="6" fill="white" opacity="0.95"/>

  <!-- Stopwatch top connector -->
  <rect x="220" y="152" width="20" height="14" rx="3" fill="white" opacity="0.95"/>

  <!-- Side button (right) -->
  <rect x="345" y="205" width="28" height="16" rx="4" fill="white" opacity="0.7" transform="rotate(-30, 359, 213)"/>

  <!-- Minute hand (pointing up) -->
  <line x1="230" y1="285" x2="230" y2="195" stroke="white" stroke-width="11" stroke-linecap="round" opacity="0.95"/>

  <!-- Second hand (pointing to 2 o'clock) -->
  <line x1="230" y1="285" x2="290" y2="245" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Center dot -->
  <circle cx="230" cy="285" r="9" fill="white" opacity="0.95"/>

  <!-- Tick marks -->
  <line x1="230" y1="172" x2="230" y2="184" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <line x1="230" y1="386" x2="230" y2="398" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <line x1="117" y1="285" x2="129" y2="285" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <line x1="331" y1="285" x2="343" y2="285" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- Task list card (right side, floating) -->
  <rect x="310" y="270" width="120" height="120" rx="16" fill="white" opacity="0.2"/>
  <rect x="312" y="272" width="116" height="116" rx="14" fill="white" opacity="0.15"/>

  <!-- Task check 1 (completed) -->
  <circle cx="338" cy="302" r="9" fill="#34d399" opacity="0.9"/>
  <polyline points="333,302 336,305 343,298" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="356" y1="302" x2="410" y2="302" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Task check 2 (completed) -->
  <circle cx="338" cy="332" r="9" fill="#34d399" opacity="0.9"/>
  <polyline points="333,332 336,335 343,328" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="356" y1="332" x2="398" y2="332" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Task check 3 (pending) -->
  <circle cx="338" cy="362" r="9" fill="none" stroke="white" stroke-width="3" opacity="0.45"/>
  <line x1="356" y1="362" x2="405" y2="362" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
</svg>
